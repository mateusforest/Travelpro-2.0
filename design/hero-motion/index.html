<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <title>TravelPro — Horizonte vivo</title>
  <script src="gsap.min.js"></script>
  <style>
    :root{--charcoal:#171B1D;--paper:#F4F1E9;--accent:#FF602E}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:1920px;height:1080px;overflow:hidden;background:var(--charcoal)}
    #root{width:1920px;height:1080px;position:relative;overflow:hidden}
    .clip{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
    #landscape{width:100%;height:100%;object-fit:cover;display:block;transform-origin:68% 54%;will-change:transform}
  </style>
</head>
<body>
  <main id="root" data-composition-id="travelpro-ambient" data-start="0" data-duration="10" data-width="1920" data-height="1080" data-fps="30">
    <div id="landscape-clip" class="clip" data-start="0" data-duration="10" data-track-index="0" data-layout-allow-overflow>
      <img id="landscape" src="hero-lencois.png" width="1672" height="941" alt="Dunas e lagoas dos Lençóis Maranhenses ao entardecer" data-layout-allow-overflow>
    </div>
  </main>
  <script>
    window.__timelines=window.__timelines||{};
    const tl=gsap.timeline({paused:true});
    // Start mid-cycle: the first second already moves, and the loop seam
    // matches both transform and velocity. Only the photo's framing changes.
    tl.fromTo('#landscape',{scale:1.07,x:-1,y:1},{scale:1.10,x:-10,y:6,duration:2.5,ease:'sine.out'},0);
    tl.to('#landscape',{scale:1.04,x:8,y:-4,duration:5,ease:'sine.inOut'},2.5);
    tl.to('#landscape',{scale:1.07,x:-1,y:1,duration:2.5,ease:'sine.in'},7.5);
    window.__timelines['travelpro-ambient']=tl;
  </script>
</body>
</html>
